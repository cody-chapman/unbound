server:
    username: "unbound"      # Dropping root privileges for security
    interface: 0.0.0.0
    port: 53

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Threading optimizations (Assuming a 2-core container limit)
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # SECURE: Explicitly allow only private container/local networks
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # File paths adjusted for RHEL layout
    root-hints: "/etc/unbound/root.hints"
    auto-trust-anchor-file: "/etc/unbound/root.key"

    # Add in any other conf file using include
    include: "/etc/unbound/unbound.conf.d/*.conf"

    # Security settings
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes    # Enhanced anti-spoofing protection

    # Crucial for container foreground execution
    do-daemonize: no

    # --- Caching Optimization Settings ---
    cache-min-ttl: 300      
    cache-max-ttl: 86400    

    # Memory Cache Size (Optimized 1:2 ratio)
    rrset-cache-size: 100m  
    msg-cache-size: 50m     

    # Optimization for performance
    prefetch: yes           
    prefetch-key: yes       
    serve-expired: yes      

# remote control
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    server-cert-file: "/etc/unbound/unbound_server.pem"
    server-key-file: "/etc/unbound/unbound_server.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
